name: "❄️ Update nix packages: meli-teto"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 0" # https://crontab.guru/#0_10_*_*_0
permissions:
  contents: write
  pull-requests: write
jobs:
  updateFlakePackages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # TODO reference the flake one ?
          nix_path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz"
      # workaround this issue 
      # https://github.com/gepbird/nix-update-action/issues/2#event-35747316493
      - name: Fetch nixpkgs source
        run: nix flake archive --json nixpkgs > /dev/null
      - name: Update flake packages
        uses: gepbird/nix-update-action@v3.1.3
        with:
          packages: "meli-teto"
