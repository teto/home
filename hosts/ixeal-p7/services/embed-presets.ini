; specifically created as an embedding llama-instance
; ...and as an OpenAI-compatible backend for docling / docling-serve VLM presets.
;
; How docling picks the model name: with `engine_type = api` it sends
; `"model": <default_repo_id>` (or its api_overrides[api] value), with
; `api_openai`/`api_lmstudio` it sends the short name.
; llama-server's router selects the preset section from that "model" field,
; so section names = docling's default_repo_id, aliases = the short names.
; Source: docling/datamodel/stage_model_specs.py (docling 2.x)
;
; NB: --embedding has no --no-embedding counterpart, so it can't live in [*]
; anymore (it would turn every VLM below into an embedding-only model).

[*]
port = 9332
; Increased ubatch size because of
; 19.43.653.521 D srv    operator(): client request thread ended
; 19.43.653.535 D srv    operator(): http: streamed chunk: {"error":{"code":500,"message":"input (529 tokens) is too large to process. increase the physical batch size (current batch size: 512)","type":"server_error"}}
; Traceback (most recent call last):
;   File "/home/teto/plugins/avante.nvim/py/rag-service/.venv/lib/python3.11/site-packages/openai/_base_client.py", line 1043, in _request
;     response.raise_for_status()
;   File "/home/teto/plugins/avante.nvim/py/rag-service/.venv/lib/python3.11/site-packages/httpx/_models.py", line 829, in raise_for_status
;     raise HTTPStatusError(message, request=request, response=self)
; httpx.HTTPStatusError: Server error '500 Internal Server Error' for url 'http://localhost:8081/v1/embeddings'

ubatch-size = 1024
; useless
; api-key seems mandatory for pi ?
api-key = toto
; models-dir = /home/teto/llama-models
; only keep  '--models-max' loaded in memory
models-max = 1
log-colors = on
log-file = /tmp/llama-embed.log
; overridden (on) in the VLM sections below
mmproj-offload = off


; ============================================================================
; Embeddings
; ============================================================================

; typical embeddings models
; all-MiniLM-L6-v2
;Hugging Face / Open Source: BGE-small-en-v1.5, E5-small-v2, or Nomadic Embed models.
[embedding-gemma-300]
hf = unsloth/embeddinggemma-300m-GGUF
embedding = on

; docling chunking preset `granite_embedding_278m` (DOCLING_SERVE_DEFAULT_CHUNKING_PRESET)
; docling only uses its *tokenizer* to size chunks; serving the matching model
; here keeps chunk sizes and embeddings consistent for RAG.
[ibm-granite/granite-embedding-278m-multilingual]
hf = bartowski/granite-embedding-278m-multilingual-GGUF:Q8_0
alias = granite-embedding-278m-multilingual
embedding = on

; Local / Open Source: Llama 3 / Llama 3.2 (via Ollama), Mistral-7B


