version = 1

[*]
models-dir = /home/teto/llama-models
; only keep  '--models-max' loaded in memory
models-max = 1
jinja = on ; the default
log-prefix = on
log-colors = on
log-file = /tmp/llamacpp.log
mmproj-offload = off

# context checkpoints
; ctx-checkpoints     = 0
log-timestamps=1

; cpu-moe => keep all Mixture of Experts (MoE) weights in the CPU
; cpu-moe = 1


; api-key = toto 
;
[qwen3.6-27b-dense]
hf = unsloth/Qwen3.6-27B-GGUF
; https://unsloth.ai/docs/models/qwen3.6#mtp-guide#mtp-benchmarks
temperature = 0.6
; experts number from 8 to 4 in Qwen 3.6 35b
; n-cpu-moe = 4
alias = qwen3.6-dense
; either an exact number, 'auto', or 'all' (default: auto)
; n-gpu-layers = 20
ctx-size = 60000
; keeps the KV cache in RAM. It will be slower, but saves VRAM
kv-offload = false
; --spec-type draft-mtp

[qwen3.8-27b-dense]
hf = unsloth/Qwen3.8-27B-GGUF
; https://unsloth.ai/docs/models/qwen3.6#mtp-guide#mtp-benchmarks
; temperature = 0.6
; experts number from 8 to 4 in Qwen 3.6 35b
; n-cpu-moe = 4
alias = qwen3.8-dense
; either an exact number, 'auto', or 'all' (default: auto)
; n-gpu-layers = 20
ctx-size = 60000
; keeps the KV cache in RAM. It will be slower, but saves VRAM
kv-offload = false
; --spec-type draft-mtp

[gpt-oss-120b-hf]
hf          = ggml-org/gpt-oss-120b-GGUF
batch-size  = 2048
ubatch-size = 2048
top-p       = 1.0
top-k       = 0
min-p       = 0.01
temp        = 1.0
chat-template-kwargs = {"reasoning_effort": "high"}

[qwen3-14b-dense]
hf = unsloth/Qwen3-14B-GGUF
fit = off

; MoE model with specific settings
[qwen3-30b-a3b-thinking]
; mtp version => need latest server
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF
; n-cpu-moe = 30
; temp = 0.6
; top-p = 0.95
; ctx-size = 8192
 
[qwen3-35b-a3b-mtp-moe]
;  unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_X
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL
ngl= 99 
c= 8192 fa= on 
np = 1
spec-type = draft-mtp 
spec-draft-n-max = 2
fit = off
