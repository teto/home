version = 1

[*]
models-dir = /home/teto/llama-models
; only keep  '--models-max' loaded in memory
; to allow embedding + other models at same time
models-max = 3
; the default
jinja = on 
log-prefix = on
log-colors = on
log-file = /tmp/llamacpp.log
mmproj-offload = off
; put them all in vram
ngl= all
ctx-size = 60000

# to avoid  send_error: task id = 332, error: input (523 tokens) is too large to process. increase the  physical batch size (current batch size: 512)                          
batch-size  = 2048
ubatch-size = 2048

; should I set it ?
; kv-unified           = 1
; parallel             = 4
; spec-default         = 1

# context checkpoints
; ctx-checkpoints     = 0
; log-timestamps=1

; cpu-moe => keep all Mixture of Experts (MoE) weights in the CPU
; cpu-moe = 1


[qwen3.6-27b-dense]
hf = unsloth/Qwen3.6-27B-GGUF
alias = qwen3.6-dense
; https://unsloth.ai/docs/models/qwen3.6#mtp-guide#mtp-benchmarks
; spec-type = draft-mtp 

[qwen3.8-27b-dense]
hf = unsloth/Qwen3.8-27B-GGUF
; https://unsloth.ai/docs/models/qwen3.6#mtp-guide#mtp-benchmarks
; temperature = 0.6
; experts number from 8 to 4 in Qwen 3.6 35b
; n-cpu-moe = 4
alias = qwen3.8-dense
; either an exact number, 'auto', or 'all' (default: auto)
ctx-size = 60000

[gpt-oss-120b-hf]
hf          = ggml-org/gpt-oss-120b-GGUF
batch-size  = 2048
ubatch-size = 2048
top-p       = 1.0
top-k       = 0
min-p       = 0.01
temp        = 1.0
chat-template-kwargs = {"reasoning_effort": "high"}

[qwen3-14b-dense]
hf = unsloth/Qwen3-14B-GGUF
fit = off

; MoE model with specific settings
[qwen3-35b-a3b-thinking]
; mtp version => need latest server
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF
; n-cpu-moe = 30
; temp = 0.6
; top-p = 0.95
; ctx-size = 8192
 
[qwen3-35b-a3b-mtp-moe]
;  unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_X
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL
c= 8192 
fa= on 
np = 1
spec-type = draft-mtp 
spec-draft-n-max = 2
fit = off



; ============================================================================
; Embeddings
; ============================================================================

; typical embeddings models
; all-MiniLM-L6-v2
;Hugging Face / Open Source: BGE-small-en-v1.5, E5-small-v2, or Nomadic Embed models.
[embedding-gemma-300]
hf = unsloth/embeddinggemma-300m-GGUF
embedding = on

; docling chunking preset `granite_embedding_278m` (DOCLING_SERVE_DEFAULT_CHUNKING_PRESET)
; docling only uses its *tokenizer* to size chunks; serving the matching model
; here keeps chunk sizes and embeddings consistent for RAG.
[ibm-granite/granite-embedding-278m-multilingual]
hf = bartowski/granite-embedding-278m-multilingual-GGUF:Q8_0
alias = granite-embedding-278m-multilingual
embedding = on

; Local / Open Source: Llama 3 / Llama 3.2 (via Ollama), Mistral-7B


; ============================================================================
; docling VLM convert presets  (vlm_pipeline_preset / DOCLING_SERVE_DEFAULT_VLM_PRESET)
; ============================================================================

; preset: granite_docling (default)  -- response_format doctags
; also code/formula preset `granite_docling`
[ibm-granite/granite-docling-258M]
hf = ggml-org/granite-docling-258M-GGUF:Q8_0
mmproj-offload = on

; preset: smoldocling -- no GGUF with mmproj found on HF, not served here

; preset: granite_vision (also picture-description preset)  -- markdown
; docling only allows transformers/vllm/ollama/lmstudio engines for it:
; use engine_type = api_lmstudio
[ibm-granite/granite-vision-3.3-2b]
hf = ibm-granite/granite-vision-3.3-2b-GGUF:Q8_0
mmproj-offload = on

; preset: qwen (also picture-description preset)  -- markdown
[Qwen/Qwen2.5-VL-3B-Instruct]
hf = ggml-org/Qwen2.5-VL-3B-Instruct-GGUF:Q8_0
mmproj-offload = on

; preset: nanonets_ocr2  -- markdown, max_tokens 15000
[nanonets/Nanonets-OCR2-3B]
hf = mradermacher/Nanonets-OCR2-3B-GGUF:Q8_0
alias = nanonets-ocr2-3b
mmproj-offload = on

; preset: glm_ocr  -- markdown
[zai-org/GLM-OCR]
hf = ggml-org/GLM-OCR-GGUF:Q8_0
alias = glm-ocr
mmproj-offload = on

; preset: lightonocr  -- markdown
[lightonai/LightOnOCR-2-1B]
hf = ggml-org/LightOnOCR-2-1B-GGUF:Q8_0
alias = lightonocr-2-1b
mmproj-offload = on

; preset: mineru2_pro  -- mineru2 format
[opendatalab/MinerU2.5-Pro-2604-1.2B]
hf = mradermacher/MinerU2.5-Pro-2604-1.2B-GGUF:Q8_0
alias = mineru2.5-pro-2604-1.2b
mmproj-offload = on

; preset: chandra_ocr2  -- html, max_tokens 12384
[datalab-to/chandra-ocr-2]
hf = prithivMLmods/chandra-ocr-2-GGUF:Q4_K_M
alias = chandra-ocr-2
mmproj-offload = on

; preset: dots_ocr  -- dots json, max_tokens 24000
[rednote-hilab/dots.ocr]
hf = ggml-org/dots.ocr-GGUF:Q8_0
alias = dots.ocr
mmproj-offload = on

; preset: deepseek_ocr  -- only ollama/lmstudio engines: use engine_type = api_lmstudio
[deepseek-ocr]
hf = ggml-org/DeepSeek-OCR-GGUF:Q8_0
mmproj-offload = on

; preset: gemma_12b  -- markdown (heavy: ~8GB at Q4_K_M)
[google/gemma-3-12b-it]
hf = ggml-org/gemma-3-12b-it-GGUF:Q4_K_M
mmproj-offload = on

