; one could eventually use
; https://github.com/ggml-org/llama.cpp/blob/master/docs/preset.md#named-presets
;
version = 1

; Preset for cached HuggingFace model
; [ggml-org/gemma-3-27b-it-GGUF:Q6_K]
; chat-template = chatml
; ngl = 123
; jinja = on
; ctx-size = 8192

[*]
; useless
; api-key seems mandatory for pi ?
api-key = toto 
models-dir = /home/teto/llama-models
; only keep  '--models-max' loaded in memory
models-max = 1
log-colors = on
log-file = /tmp/llamacpp.log
mmproj-offload = off
; n-gpu-layers = -1
; cache-type-k

; ctx-checkpoints size is model dependendan, seems like gemma consumes more
; ctx-checkpoints 
; https://github.com/ggml-org/llama.cpp/blob/b9b7d94fc10a8039befd1bc3af4f4b09c620c351/examples/main/main.cpp#L402-L405
; keep_n keeps N initial tokens when exceeding contextmodels-max https://github.com/ggml-org/llama.cpp/issues/1647
;
; : Include prompt processing progress in stream mode. The progress will be contained inside prompt_progress with 4 values: total, cache, processed, and time_ms. The overall progress is processed/total, while the actual timed progress is (processed-cache)/(total-cache). The time_ms field contains the elapsed time in milliseconds since prompt processing started. 
log-timestamps=1
; log-prefix=1
; cpu-moe => keep all Mixture of Experts (MoE) weights in the CPU
cpu-moe = 1
; alternatively n-cpu-moe

[mistral-7b]
; we need v 3
m = /home/teto/llama-models/mistral-7b-v0.1.Q8_0.gguf
; models-dir = 

; Custom local model with absolute path
[ministral3-14b]
; m = Ministral-3-14B-Base-2512.Q6_K.gguf
m = /home/teto/llama-models/Ministral-3-14B-Base-2512.Q6_K-weird-prompt-doesntwork.gguf
; mmproj = Ministral-3-14B-Base-2512.Q6_K.gguf
ctx-size = 8192
; temp = 0.7
; top-p = 0.8
; chat-template-kwargs = {"reasoning_effort": "high"}


[ministral3-3b]
