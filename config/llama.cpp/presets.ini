[qwen3.6-27b-dense]
hf = unsloth/Qwen3.6-27B-GGUF
; https://unsloth.ai/docs/models/qwen3.6#mtp-guide#mtp-benchmarks
temperature = 0.6
; experts number from 8 to 4 in Qwen 3.6 35b
; n-cpu-moe = 4
alias = qwen3.6-dense
; either an exact number, 'auto', or 'all' (default: auto)
n-gpu-layers = all
ctx-size = 60000
; keeps the KV cache in RAM. It will be slower, but saves VRAM
kv-offload = false
; --spec-type draft-mtp
reasoning-budget = 2000
reasoning-budget-message = "Exceeded reasoning budget"

[qwen3.8-27b-dense]
hf = unsloth/Qwen3.8-27B-GGUF
; https://unsloth.ai/docs/models/qwen3.6#mtp-guide#mtp-benchmarks
; temperature = 0.6
; experts number from 8 to 4 in Qwen 3.6 35b
; n-cpu-moe = 4
alias = qwen3.8-dense
; either an exact number, 'auto', or 'all' (default: auto)
n-gpu-layers = 20
ctx-size = 60000
; keeps the KV cache in RAM. It will be slower, but saves VRAM
kv-offload = false
; --spec-type draft-mtp

[gpt-oss-120b-hf]
hf          = ggml-org/gpt-oss-120b-GGUF
batch-size  = 2048
ubatch-size = 2048
top-p       = 1.0
top-k       = 0
min-p       = 0.01
temp        = 1.0
chat-template-kwargs = {"reasoning_effort": "high"}

[qwen3-14b-dense]
hf = unsloth/Qwen3-14B-GGUF
fit = off

; MoE model with specific settings
[qwen3-30b-a3b-thinking]
